name: Build

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: 'write'

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os:
          - macos-15
          - ubuntu-22.04
          - windows-latest

    steps:
      - name: Install Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'
          check-latest: true

      - name: Setup GO
        run: |
          go version
          echo GOPATH=$(go env GOPATH) >> $GITHUB_ENV
          echo GOBIN=$(go env GOPATH)/bin >> $GITHUB_ENV
          echo $(go env GOPATH)/bin >> $GITHUB_PATH

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install LibSecret
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get install -y libsecret-1-dev

      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25.2.1

      - name: Install Webpack
        run: npm install --save-dev webpack-cli --legacy-peer-deps

      - name: Update locale
        run: npm run update:locale
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Addon only AMD
        if: ${{ startsWith(matrix.os, 'windows-') }}
        shell: bash
        run: |
          ./update-ci.sh --user="${{ github.actor }}" --token="${{ secrets.GITHUB_TOKEN }}" --os="${{ matrix.os }}" --middleware-version="$( cat middleware.version )"

      - name: Update Addon AMD and ARM
        if: ${{ !startsWith(matrix.os, 'windows-') }}
        shell: bash
        run: |
          ./update-ci.sh --user="${{ github.actor }}" --token="${{ secrets.GITHUB_TOKEN }}" --os="${{ matrix.os }}" --middleware-version="$( cat middleware.version )" --arch="arm"
          ./update-ci.sh --user="${{ github.actor }}" --token="${{ secrets.GITHUB_TOKEN }}" --os="${{ matrix.os }}" --middleware-version="$( cat middleware.version )" --arch="amd"

      - name: Build Native Messaging Host Windows
        if: ${{ startsWith(matrix.os, 'windows-') }}
        run: npm run build:nmh-win
        env:
          CGO_ENABLED: 0

      - name: Build Native Messaging Host
        if: ${{ !startsWith(matrix.os, 'windows-') }}
        run: npm run build:nmh
        env:
          CGO_ENABLED: 0

      - name: Build
        uses: samuelmeuli/action-electron-builder@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release: false
          args: ${{ startsWith(matrix.os, 'macos-') && '--arm64 --x64' || '' }} --publish never
        env:
          DEBUG: electron-builder
          USE_HARD_LINKS: false
          ELECTRON_SKIP_NOTARIZE: 1
          ELECTRON_SKIP_SENTRY: 1

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          mv dist/*.{zip,dmg,deb,AppImage,exe,snap,rpm,tar.gz} artifacts 2>/dev/null || true
          # Remove helper/nmh binaries that are not installers (Windows)
          rm -f artifacts/anytypeHelper.exe artifacts/nativeMessagingHost.exe 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: warn

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: "artifacts/**"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
